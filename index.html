<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あなたのいいところ診断</title>
  <!-- BootstrapのCDN（外部CSS）を読み込む [22] -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body class="bg-primary-subtle"> <!-- 淡い青の背景色 [23] -->

  <!-- ヘッダナビゲーションバーの作成 [23] -->
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
      <span class="navbar-brand">あなたのいいところ診断</span>
    </div>
  </nav>

  <!-- メインコンテンツ領域 [23] -->
  <div class="container pt-5">
    <!-- グリッドシステムによる横幅と配置の調整 [23] -->
    <div class="row">
      <div class="col-sm-9 col-lg-6">
        <p>診断したい名前を入れて下さい</p>
        
        <!-- インプットグループを使用したフォームの構築 [23] -->
        <div class="input-group mb-3">
          <input type="text" id="user-name" class="form-control" placeholder="名前を入力してください">
          <button id="assessment" class="btn btn-primary">診断する</button>
        </div>
      </div>
    </div>

    <!-- 診断結果表示用の領域（グリッドによる幅制限を追加） [24] -->
    <div class="row">
      <div class="col-lg-9">
        <div id="result-area"></div>
      </div>
    </div>

    <!-- ツイート表示エリア（上部余白を追加） [24] -->
    <div class="row">
      <div class="col-lg-9">
        <div id="tweet-area" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="assessment.js"></script>
</body>
</html>
